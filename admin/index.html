<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin - Keur Ndaay</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-6xl mx-auto p-6">

  <!-- HEADER -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">📊 Dashboard Admin</h1>
  </div>

  <!-- ================= PRODUITS ================= -->
  <div class="bg-white p-4 rounded shadow mb-6">

    <h2 class="text-xl font-bold mb-3">🍹 Produits</h2>

    <!-- SEARCH -->
    <input id="search" oninput="load()" placeholder="Rechercher produit..."
      class="border p-2 w-full mb-3 rounded">

    <!-- ADD PRODUCT -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-4">

      <input id="nom" placeholder="Nom" class="border p-2 rounded">
      <input id="prix" placeholder="Prix" class="border p-2 rounded">
      <input id="categorie" placeholder="Catégorie" class="border p-2 rounded">
      <input id="image" placeholder="URL Image" class="border p-2 rounded">

      <button onclick="addProduct()" class="bg-green-600 text-white rounded p-2">
        Ajouter
      </button>

    </div>

    <div id="products"></div>

  </div>

  <!-- ================= COMMANDES ================= -->
  <div class="bg-white p-4 rounded shadow">

    <h2 class="text-xl font-bold mb-3">📦 Commandes</h2>

    <!-- FILTER -->
    <select onchange="load()" id="filter" class="border p-2 mb-3 rounded">
      <option value="">Tous</option>
      <option>En attente</option>
      <option>Confirmée</option>
      <option>Livrée</option>
      <option>Annulée</option>
    </select>

    <div id="orders"></div>

  </div>

</div>

<script>

const API = "https://keur-ndeye-production-cb90.up.railway.app";

/* ================= LOAD ================= */

async function load(){

  const search = document.getElementById("search")?.value || "";
  const filter = document.getElementById("filter")?.value || "";

  const products = await fetch(API+"/api/produits?search="+search)
    .then(r=>r.json());

  const orders = await fetch(API+"/api/commandes?statut="+filter)
    .then(r=>r.json());

  renderProducts(products);
  renderOrders(orders);
}

/* ================= PRODUITS ================= */

function renderProducts(data){

  document.getElementById("products").innerHTML = data.map(p=>`

    <div class="border p-3 flex justify-between items-center mb-2">

      <div class="flex gap-3 items-center">

        <img src="${p.image || ''}" class="w-12 h-12 object-cover rounded">

        <div>
          <b>${p.nom}</b><br>
          <small>${p.categorie || ''}</small>
        </div>

      </div>

      <div class="flex gap-2 items-center">

        <span class="font-bold text-green-700">${p.prix} FCFA</span>

        <button onclick="editProduct('${p._id}')" class="bg-blue-500 text-white px-2 py-1 rounded">
          Edit
        </button>

        <button onclick="deleteProduct('${p._id}')" class="bg-red-500 text-white px-2 py-1 rounded">
          Sup
        </button>

      </div>

    </div>

  `).join('');
}

/* ADD PRODUCT */

async function addProduct(){

  await fetch(API+"/api/produits",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      nom: nom.value,
      prix: prix.value,
      categorie: categorie.value,
      image: image.value
    })
  });

  nom.value = "";
  prix.value = "";
  categorie.value = "";
  image.value = "";

  load();
}

/* DELETE */

async function deleteProduct(id){
  await fetch(API+"/api/produits/"+id,{ method:"DELETE" });
  load();
}

/* EDIT SIMPLE */

async function editProduct(id){

  const newName = prompt("Nouveau nom ?");
  const newPrice = prompt("Nouveau prix ?");

  if(!newName || !newPrice) return;

  await fetch(API+"/api/produits/"+id,{
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      nom: newName,
      prix: newPrice
    })
  });

  load();
}

/* ================= COMMANDES ================= */

function renderOrders(data){

  document.getElementById("orders").innerHTML = data.map(c=>`

    <div class="border p-3 mb-2">

      <div class="font-bold">
        ${c.client?.nom || "Client"}
      </div>

      <div class="text-sm text-gray-500">
        ${(c.articles || []).map(a=>a.nom).join(", ")}
      </div>

      <div class="flex justify-between items-center mt-2">

        <div class="font-bold text-green-700">
          ${c.total} FCFA
        </div>

        <select onchange="updateStatus('${c._id}',this.value)" class="border p-1 rounded">
          <option ${c.statut=="En attente"?"selected":""}>En attente</option>
          <option ${c.statut=="Confirmée"?"selected":""}>Confirmée</option>
          <option ${c.statut=="Livrée"?"selected":""}>Livrée</option>
          <option ${c.statut=="Annulée"?"selected":""}>Annulée</option>
        </select>

        <button onclick="deleteOrder('${c._id}')" class="bg-red-500 text-white px-2 py-1 rounded">
          Sup
        </button>

      </div>

    </div>

  `).join('');
}

/* UPDATE STATUS */

async function updateStatus(id,status){

  await fetch(API+"/api/commandes/"+id,{
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ statut: status })
  });

}

/* DELETE ORDER */

async function deleteOrder(id){
  await fetch(API+"/api/commandes/"+id,{ method:"DELETE" });
  load();
}

/* INIT */

load();

</script>

</body>
</html>
